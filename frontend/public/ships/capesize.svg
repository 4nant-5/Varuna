<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="46%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="superstructureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shipGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="240" fill="url(#skyGrad)"/>
  
  <!-- Subtle Horizon Light -->
  <ellipse cx="400" cy="235" rx="360" ry="25" fill="#38bdf8" opacity="0.15"/>

  <!-- Water Surface & Wake -->
  <rect y="235" width="800" height="125" fill="url(#seaGrad)"/>
  <path d="M 0,238 Q 150,235 300,240 T 600,237 T 800,239" stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 0,248 Q 200,244 400,250 T 800,247" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 50,265 Q 250,260 500,266 T 800,262" stroke="#0284c7" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Bow Wave -->
  <path d="M 720,245 Q 745,248 780,260 Q 750,255 710,249" fill="#e0f2fe" opacity="0.85"/>

  <!-- Capesize Ship Body -->
  <g filter="url(#shipGlow)">
    <!-- Main Hull (Bulbous bow at right, stern at left) -->
    <path d="M 80,215 L 140,215 L 680,215 Q 730,217 745,235 L 755,255 Q 735,260 700,260 L 120,260 Q 90,258 75,245 Q 70,230 80,215 Z" fill="url(#hullGrad)"/>
    
    <!-- Bulbous Bow Under Water -->
    <path d="M 740,248 Q 770,255 765,265 Q 740,268 730,260 Z" fill="#991b1b" opacity="0.9"/>

    <!-- Waterline White Boot-topping Line -->
    <line x1="85" y1="236" x2="740" y2="236" stroke="#ffffff" stroke-width="1.8" opacity="0.75"/>
    
    <!-- Draft marks indicator at bow & stern -->
    <line x1="725" y1="225" x2="725" y2="250" stroke="#facc15" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="95" y1="225" x2="95" y2="250" stroke="#facc15" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Cargo Holds / Hatches (Capesize has 9 large hatches) -->
    <!-- Hatch 1 to 9 -->
    <g fill="#475569" stroke="#1e293b" stroke-width="1">
      <rect x="230" y="206" width="38" height="9" rx="1.5"/>
      <rect x="280" y="206" width="38" height="9" rx="1.5"/>
      <rect x="330" y="206" width="38" height="9" rx="1.5"/>
      <rect x="380" y="206" width="38" height="9" rx="1.5"/>
      <rect x="430" y="206" width="38" height="9" rx="1.5"/>
      <rect x="480" y="206" width="38" height="9" rx="1.5"/>
      <rect x="530" y="206" width="38" height="9" rx="1.5"/>
      <rect x="580" y="206" width="38" height="9" rx="1.5"/>
      <rect x="630" y="206" width="36" height="9" rx="1.5"/>
    </g>

    <!-- Deck Coamings & Pipe Racks -->
    <line x1="215" y1="214" x2="685" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="220" y1="210" x2="675" y2="210" stroke="#64748b" stroke-width="0.8"/>

    <!-- Stern Superstructure / Bridge -->
    <g fill="url(#superstructureGrad)" stroke="#64748b" stroke-width="0.8">
      <!-- Deck A -->
      <rect x="115" y="195" width="85" height="20" rx="1"/>
      <!-- Deck B -->
      <rect x="120" y="177" width="75" height="18" rx="1"/>
      <!-- Deck C / Bridge -->
      <polygon points="122,177 122,160 190,160 195,177"/>
      <!-- Bridge Wings -->
      <rect x="116" y="160" width="82" height="6" rx="1" fill="#e2e8f0"/>
      <!-- Bridge Windows (Dark Navy Glass) -->
      <rect x="126" y="166" width="62" height="5" fill="#0f172a"/>
    </g>

    <!-- Funnel / Smokestack with Company Stripe -->
    <g>
      <polygon points="135,160 137,135 152,135 155,160" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
      <polygon points="136,145 137,140 153,140 154,145" fill="#38bdf8"/>
      <!-- Exhaust Black Rim -->
      <rect x="136" y="133" width="17" height="3" fill="#0f172a"/>
      <!-- Subtle Smoke -->
      <path d="M 144,132 Q 130,118 110,115 Q 90,112 60,114" stroke="#e2e8f0" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/>
    </g>

    <!-- Radar Mast & Antennas -->
    <line x1="160" y1="160" x2="160" y2="128" stroke="#334155" stroke-width="2"/>
    <line x1="152" y1="138" x2="168" y2="138" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="160" cy="128" rx="7" ry="2.5" fill="#0284c7"/>
    <line x1="160" y1="128" x2="160" y2="120" stroke="#64748b" stroke-width="1"/>
    <!-- Radar Scanner -->
    <rect x="154" y="132" width="12" height="2" fill="#ffffff"/>

    <!-- Bow Mast -->
    <line x1="685" y1="215" x2="685" y2="185" stroke="#475569" stroke-width="1.8"/>
    <line x1="680" y1="195" x2="690" y2="195" stroke="#475569" stroke-width="1.2"/>

    <!-- Ship Name on Bow & Stern -->
    <text x="660" y="230" fill="#f8fafc" font-family="monospace" font-size="7" font-weight="bold" letter-spacing="1">MV OCEAN CAPE</text>
    <text x="95" y="230" fill="#f8fafc" font-family="monospace" font-size="6">PORT HEDLAND</text>
  </g>

  <!-- Spec Overlay Ribbon -->
  <g transform="translate(20, 20)">
    <rect width="210" height="54" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="0.05em">CAPESIZE BULK CARRIER</text>
    <text x="14" y="38" fill="#e2e8f0" font-family="monospace" font-size="11">180,000 DWT • 9 Hatches</text>
    <text x="14" y="48" fill="#94a3b8" font-family="sans-serif" font-size="9">Gearless • Max Draft 18.5m • LOA 292m</text>
  </g>
</svg>
