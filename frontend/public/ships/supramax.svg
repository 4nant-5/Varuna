<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGradS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="seaGradS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="hullGradS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="48%" stop-color="#172554"/>
      <stop offset="49%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" fill="url(#skyGradS)"/>
  <ellipse cx="400" cy="235" rx="350" ry="18" fill="#38bdf8" opacity="0.1"/>
  <rect y="235" width="800" height="125" fill="url(#seaGradS)"/>
  <path d="M 0,238 Q 200,234 400,239 T 800,237" stroke="#7dd3fc" stroke-width="1.6" fill="none" opacity="0.5"/>
  <path d="M 660,246 Q 690,249 725,259 Q 700,255 655,250" fill="#e0f2fe" opacity="0.8"/>

  <g>
    <!-- Hull (Supramax: 5 holds, 64,000 DWT) -->
    <path d="M 130,220 L 180,220 L 630,220 Q 675,222 690,236 L 700,254 Q 680,258 640,258 L 160,258 Q 135,256 125,244 Q 120,232 130,220 Z" fill="url(#hullGradS)"/>
    <line x1="135" y1="238" x2="685" y2="238" stroke="#ffffff" stroke-width="1.6" opacity="0.75"/>

    <!-- 5 Cargo Holds -->
    <g fill="#475569" stroke="#0f172a" stroke-width="1">
      <rect x="250" y="212" width="55" height="8" rx="1"/>
      <rect x="330" y="212" width="55" height="8" rx="1"/>
      <rect x="410" y="212" width="55" height="8" rx="1"/>
      <rect x="490" y="212" width="55" height="8" rx="1"/>
      <rect x="570" y="212" width="50" height="8" rx="1"/>
    </g>

    <!-- 4 Deck Pedestal Cranes (Geared Bulk Carrier 4x30MT) -->
    <!-- Crane 1 -->
    <g stroke="#f59e0b" stroke-width="2.5" fill="#f59e0b">
      <rect x="235" y="200" width="8" height="20" fill="#d97706" stroke="#b45309" stroke-width="1"/>
      <line x1="239" y1="200" x2="280" y2="175"/>
      <line x1="280" y1="175" x2="280" y2="192" stroke="#475569" stroke-width="1.2"/>
      <rect x="277" y="192" width="6" height="6" fill="#334155" stroke="none"/>
    </g>
    <!-- Crane 2 -->
    <g stroke="#f59e0b" stroke-width="2.5" fill="#f59e0b">
      <rect x="315" y="200" width="8" height="20" fill="#d97706" stroke="#b45309" stroke-width="1"/>
      <line x1="319" y1="200" x2="360" y2="175"/>
      <line x1="360" y1="175" x2="360" y2="192" stroke="#475569" stroke-width="1.2"/>
      <rect x="357" y="192" width="6" height="6" fill="#334155" stroke="none"/>
    </g>
    <!-- Crane 3 -->
    <g stroke="#f59e0b" stroke-width="2.5" fill="#f59e0b">
      <rect x="395" y="200" width="8" height="20" fill="#d97706" stroke="#b45309" stroke-width="1"/>
      <line x1="399" y1="200" x2="440" y2="175"/>
      <line x1="440" y1="175" x2="440" y2="192" stroke="#475569" stroke-width="1.2"/>
      <rect x="437" y="192" width="6" height="6" fill="#334155" stroke="none"/>
    </g>
    <!-- Crane 4 -->
    <g stroke="#f59e0b" stroke-width="2.5" fill="#f59e0b">
      <rect x="475" y="200" width="8" height="20" fill="#d97706" stroke="#b45309" stroke-width="1"/>
      <line x1="479" y1="200" x2="520" y2="175"/>
      <line x1="520" y1="175" x2="520" y2="192" stroke="#475569" stroke-width="1.2"/>
      <rect x="517" y="192" width="6" height="6" fill="#334155" stroke="none"/>
    </g>

    <!-- Superstructure -->
    <rect x="160" y="202" width="65" height="18" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
    <polygon points="163,202 163,186 215,186 218,202" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
    <rect x="167" y="190" width="46" height="4" fill="#0f172a"/>
    <polygon points="172,186 174,168 186,168 188,186" fill="#10b981" stroke="#059669" stroke-width="1"/>
    <rect x="173" y="166" width="14" height="2.5" fill="#0f172a"/>

    <text x="615" y="232" fill="#f8fafc" font-family="monospace" font-size="7" font-weight="bold">MV ULTRAMAX VOYAGER</text>
  </g>

  <!-- Ribbon -->
  <g transform="translate(20, 20)">
    <rect width="210" height="54" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">SUPRAMAX / ULTRAMAX</text>
    <text x="14" y="38" fill="#e2e8f0" font-family="monospace" font-size="11">64,000 DWT • 5 Hatches</text>
    <text x="14" y="48" fill="#94a3b8" font-family="sans-serif" font-size="9">Geared (4x30T Cranes + Grabs) • Draft 13.3m</text>
  </g>
</svg>
