<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGradP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="60%" stop-color="#1e3e62"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="seaGradP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="hullGradP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="51%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shipShadowP" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="240" fill="url(#skyGradP)"/>
  <ellipse cx="400" cy="235" rx="350" ry="20" fill="#38bdf8" opacity="0.12"/>
  <rect y="235" width="800" height="125" fill="url(#seaGradP)"/>
  <path d="M 0,238 Q 200,234 400,239 T 800,237" stroke="#7dd3fc" stroke-width="1.8" fill="none" opacity="0.5"/>
  <path d="M 680,246 Q 710,249 745,260 Q 720,256 675,250" fill="#e0f2fe" opacity="0.8"/>

  <g filter="url(#shipShadowP)">
    <!-- Hull (Panamax: 7 holds, 82,000 DWT) -->
    <path d="M 110,217 L 160,217 L 650,217 Q 695,219 710,235 L 720,254 Q 700,258 660,258 L 140,258 Q 115,256 105,244 Q 100,230 110,217 Z" fill="url(#hullGradP)"/>
    <line x1="115" y1="237" x2="705" y2="237" stroke="#ffffff" stroke-width="1.6" opacity="0.75"/>
    <line x1="695" y1="228" x2="695" y2="248" stroke="#facc15" stroke-width="1.2" stroke-dasharray="2,2"/>

    <!-- 7 Cargo Holds -->
    <g fill="#475569" stroke="#1e293b" stroke-width="1">
      <rect x="240" y="209" width="46" height="8" rx="1"/>
      <rect x="300" y="209" width="46" height="8" rx="1"/>
      <rect x="360" y="209" width="46" height="8" rx="1"/>
      <rect x="420" y="209" width="46" height="8" rx="1"/>
      <rect x="480" y="209" width="46" height="8" rx="1"/>
      <rect x="540" y="209" width="46" height="8" rx="1"/>
      <rect x="600" y="209" width="44" height="8" rx="1"/>
    </g>

    <!-- Superstructure -->
    <rect x="140" y="198" width="75" height="19" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <rect x="145" y="180" width="65" height="18" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
    <polygon points="147,180 147,164 205,164 209,180" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
    <rect x="151" y="169" width="54" height="4.5" fill="#0f172a"/>

    <!-- Funnel -->
    <polygon points="158,164 160,142 173,142 175,164" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
    <rect x="159" y="140" width="15" height="3" fill="#0f172a"/>
    <line x1="180" y1="164" x2="180" y2="135" stroke="#334155" stroke-width="1.8"/>
    <ellipse cx="180" cy="135" rx="5" ry="2" fill="#38bdf8"/>

    <!-- Text -->
    <text x="635" y="230" fill="#f8fafc" font-family="monospace" font-size="7" font-weight="bold">MV KAMSAR LEADER</text>
  </g>

  <!-- Ribbon -->
  <g transform="translate(20, 20)">
    <rect width="210" height="54" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">PANAMAX / KAMSARMAX</text>
    <text x="14" y="38" fill="#e2e8f0" font-family="monospace" font-size="11">82,500 DWT • 7 Hatches</text>
    <text x="14" y="48" fill="#94a3b8" font-family="sans-serif" font-size="9">Gearless • Max Draft 14.5m • Beam 32.26m</text>
  </g>
</svg>
