<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGradH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="60%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="seaGradH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="hullGradH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="48%" stop-color="#022c22"/>
      <stop offset="49%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" fill="url(#skyGradH)"/>
  <ellipse cx="400" cy="235" rx="350" ry="18" fill="#38bdf8" opacity="0.1"/>
  <rect y="235" width="800" height="125" fill="url(#seaGradH)"/>
  <path d="M 0,238 Q 200,234 400,239 T 800,237" stroke="#7dd3fc" stroke-width="1.6" fill="none" opacity="0.5"/>

  <g>
    <!-- Handysize Hull (38,000 DWT) -->
    <path d="M 160,222 L 205,222 L 600,222 Q 645,224 660,237 L 670,253 Q 650,257 615,257 L 190,257 Q 165,255 155,244 Q 150,232 160,222 Z" fill="url(#hullGradH)"/>
    <line x1="165" y1="238" x2="655" y2="238" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>

    <!-- 4 Cargo Holds -->
    <g fill="#475569" stroke="#0f172a" stroke-width="1">
      <rect x="280" y="214" width="60" height="8" rx="1"/>
      <rect x="365" y="214" width="60" height="8" rx="1"/>
      <rect x="450" y="214" width="60" height="8" rx="1"/>
      <rect x="535" y="214" width="55" height="8" rx="1"/>
    </g>

    <!-- Cranes -->
    <g stroke="#eab308" stroke-width="2" fill="#ca8a04">
      <rect x="268" y="204" width="7" height="18" fill="#ca8a04"/>
      <line x1="271" y1="204" x2="310" y2="182"/>
      <rect x="353" y="204" width="7" height="18" fill="#ca8a04"/>
      <line x1="356" y1="204" x2="395" y2="182"/>
      <rect x="438" y="204" width="7" height="18" fill="#ca8a04"/>
      <line x1="441" y1="204" x2="480" y2="182"/>
    </g>

    <!-- Superstructure -->
    <rect x="185" y="204" width="60" height="18" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
    <polygon points="188,204 188,188 238,188 241,204" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
    <rect x="192" y="193" width="42" height="3.5" fill="#0f172a"/>
    <polygon points="196,188 198,172 208,172 210,188" fill="#f97316" stroke="#ea580c" stroke-width="1"/>

    <text x="590" y="233" fill="#f8fafc" font-family="monospace" font-size="7" font-weight="bold">MV HANDY PRIDE</text>
  </g>

  <!-- Ribbon -->
  <g transform="translate(20, 20)">
    <rect width="210" height="54" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">HANDYMAX / HANDYSIZE</text>
    <text x="14" y="38" fill="#e2e8f0" font-family="monospace" font-size="11">38,000 DWT • 4 Hatches</text>
    <text x="14" y="48" fill="#94a3b8" font-family="sans-serif" font-size="9">Geared (3-4 Cranes) • Shallow Draft 10.5m</text>
  </g>
</svg>
